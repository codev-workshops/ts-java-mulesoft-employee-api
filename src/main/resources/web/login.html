<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Service API - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            color: #333;
            margin: 0;
            font-size: 2rem;
        }
        .login-header p {
            color: #666;
            margin: 0.5rem 0 0 0;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .login-btn:hover {
            transform: translateY(-2px);
        }
        .create-account {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }
        .create-account a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .create-account a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #e74c3c;
            text-align: center;
            margin: 1rem 0;
            padding: 0.5rem;
            background: #fdf2f2;
            border: 1px solid #fecaca;
            border-radius: 5px;
            display: none;
        }
        .success-message {
            color: #27ae60;
            text-align: center;
            margin: 1rem 0;
            padding: 0.5rem;
            background: #f0f9f4;
            border: 1px solid #a7f3d0;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Sign in to access Employee Services</p>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>
        
        <div class="create-account">
            <p>Don't have an account? <a href="register.html">Create Account</a></p>
        </div>
    </div>

    <script>
        // Extract userId from URL parameters for Salesforce integration
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Check if we're in a popup window from Salesforce
        const isPopup = window.opener !== null;
        const salesforceUserId = getUrlParameter('userId');

        // Show context message if opened from Salesforce
        if (isPopup && salesforceUserId) {
            document.querySelector('.login-header p').textContent = 
                'Connecting your Salesforce account to Employee Services';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            hideMessages();
            
            try {
                // Include userId in login request for Salesforce integration
                const loginPayload = {
                    username: username,
                    password: password
                };

                // Add userId if we're in Salesforce context
                if (salesforceUserId) {
                    loginPayload.userId = salesforceUserId;
                }

                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(loginPayload)
                });
                
                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    // Check if we're in Salesforce popup mode
                    if (isPopup && window.opener) {
                        // Salesforce Named Credentials integration
                        showSuccess('Authentication successful! Connecting to Salesforce...');
                        
                        // Send token data to Salesforce parent window
                        window.opener.postMessage({
                            type: 'API_AUTH_SUCCESS',
                            token: data.access_token,
                            refresh_token: data.refresh_token,
                            userId: data.user_id || salesforceUserId,
                            client_id: data.client_id,
                            expires_in: data.expires_in
                        }, '*');

                        // Close popup after slight delay
                        setTimeout(() => {
                            window.close();
                        }, 1500);
                    } else {
                        // Standard web login (not popup)
                        showSuccess('Login successful! Your access token: ' + data.access_token);
                        localStorage.setItem('access_token', data.access_token);
                        localStorage.setItem('refresh_token', data.refresh_token);
                        
                        setTimeout(() => {
                            document.getElementById('loginForm').reset();
                            hideMessages();
                        }, 5000);
                    }
                } else {
                    const errorMessage = data.error_description || data.error || 'Login failed';
                    showError(errorMessage);
                    
                    // Send error to Salesforce if in popup mode
                    if (isPopup && window.opener) {
                        window.opener.postMessage({
                            type: 'API_AUTH_ERROR',
                            error: 'Authentication failed: ' + errorMessage
                        }, '*');
                        
                        setTimeout(() => {
                            window.close();
                        }, 3000);
                    }
                }
            } catch (error) {
                const errorMessage = 'Network error: Unable to connect to server';
                showError(errorMessage);
                
                // Send network error to Salesforce if in popup mode
                if (isPopup && window.opener) {
                    window.opener.postMessage({
                        type: 'API_AUTH_ERROR',
                        error: errorMessage
                    }, '*');
                    
                    setTimeout(() => {
                        window.close();
                    }, 3000);
                }
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
        
        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        // Handle popup close events
        window.addEventListener('beforeunload', function() {
            if (isPopup && window.opener) {
                // Notify Salesforce if popup is closed without authentication
                try {
                    window.opener.postMessage({
                        type: 'API_AUTH_CANCELLED',
                        error: 'Authentication window was closed'
                    }, '*');
                } catch (e) {
                    // Ignore errors if parent window is not accessible
                }
            }
        });
    </script>
</body>
</html>
